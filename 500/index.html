}

if (rec.kind === 'discard') {

}
const best = r.stats && r.stats.best, chosen = r.stats && r.stats.chosen;
const parts = [];
if (best && chosen && best.makeRate != null && chosen.makeRate != null && Math.abs(best.makeRate - chosen.makeRate) >= 0.03) {
parts.push(`contract odds ${fmtPct(chosen.makeRate)} → ${fmtPct(best.makeRate)} with ${moveShort(r.best, r.bestNom)}`);
}
if (chosen && chosen.oppRuffRate > 0.35) {
parts.push(`an opponent could ruff in ${fmtPct(chosen.oppRuffRate)} of consistent deals`);
}

for (let s = 1; s < 4; s++) {

}
if (voidsSeen.length && parts.length < 2) parts.push(voidsSeen[0]);
} catch (e) {}

function safeStats() {
const st = Persist.get('stats', {});
return (st && typeof st === 'object' && !Array.isArray(st)) ? st : {};
}
function bumpStats(fn) {
const st = safeStats();
fn(st);
Persist.set('stats', st);
}
function bestSuitLabel(st) {
let best = -1, idx = -1;
for (let s = 0; s <= 4; s++) {
const n = st['suit' + s] || 0;
if (n > best) { best = n; idx = s; }
}
return best > 0 ? `${Core.STRAIN_CHAR[idx]} (${best} made)` : '—';
}
function lastMatchLabel() {
const lm = Persist.get('lastMatch', null);
if (!lm || !Array.isArray(lm.scores)) return '—';
return `${lm.won ? 'won' : 'lost'} ${lm.scores[0]}–${lm.scores[1]}`;
}

openPanel(panel, '#btnCloseSettings');

function showRules() {
const panel = document.createElement('div');
panel.className = 'panel';
panel.innerHTML = `
<h2>How this table plays 500</h2>
<div class="help-body">
<h3>The deal</h3>
45 cards — 4 through Ace in every suit, plus the Joker. Ten cards each; five to the kitty.
You partner ${esc(bots[2].name)} across the table against ${esc(bots[3].name)} and ${esc(bots[1].name)}.
<h3>Bidding</h3>
Bid the number of tricks (6–10) your partnership will win, and the trump suit. Passing drops
you from the auction. The winning bidder takes the kitty, buries five cards, and leads first.
<h3>Trumps</h3>
Joker is the highest trump, then the <b>Right Bower</b> (jack of trumps), then the <b>Left Bower</b>
(jack of the same-colour suit — it counts as a trump for every purpose), then A K Q 10 … 4.
Trump cards are shown on gilded faces so the bowers are never a surprise.
<h3>The joker in No Trump</h3>
In No Trump the joker is the only trump. When you <b>lead</b> it, you call a suit that has
<b>not yet been led</b> and the other players must follow that suit if they can — the joker
itself still wins the trick. Once all four suits have been led the joker may no longer be led
at all, except to the last trick. Otherwise the joker may only be played when you cannot
follow suit.
<h3>Misère &amp; Open Misère</h3>
<b>Misère</b> (250) is a contract to <b>lose every trick</b>, playing alone with no trumps —
your partner puts their cards face down and sits out, and tricks are three-handed. It can
only be bid over a seven bid, and it ranks above every seven and below every eight.
<b>Open Misère</b> (500) can be bid at any time, ranks between 10<span class="red">♦</span>
and 10<span class="red">♥</span>, and your hand is placed face up after the first trick.
The contractor still takes the kitty and buries five. Take even one trick and the contract
fails; the defenders score nothing either way. In misère you <b>must</b> play the joker when
you cannot follow suit — bury it if you bid misère, or it will win you a trick.
<h3>Contract values</h3>
<table>
<tr><th></th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr>
<tr><td>♠</td><td>40</td><td>140</td><td>240</td><td>340</td><td>440</td></tr>
<tr><td>♣</td><td>60</td><td>160</td><td>260</td><td>360</td><td>460</td></tr>
<tr><td><span class="red">♦</span></td><td>80</td><td>180</td><td>280</td><td>380</td><td>480</td></tr>
<tr><td><span class="red">♥</span></td><td>100</td><td>200</td><td>300</td><td>400</td><td>500</td></tr>
<tr><td>NT</td><td>120</td><td>220</td><td>320</td><td>420</td><td>520</td></tr>
</table>
<h3>Scoring</h3>
Make the contract with your combined partnership tricks to add its value; fail and it is
subtracted. Defenders always score 10 per trick. Winning all ten tricks scores at least 250.
First side to <b>500 wins</b>; falling to <b>−500 loses</b>. Thresholds are checked only after a
hand is fully scored.
<h3>Bid practice</h3>
A drill for the auction alone. You must hold the <b>winning bid</b> to play the hand — if a
bot takes the contract, or everyone passes, the deal is thrown in and a new one dealt. No
score is kept between hands; instead every bid on the table is shown with what it would
score, and the full ladder of contract values sits on the felt through the auction.
<h3>The coach</h3>
After each hand, the same search engine that powers the bots reviews your decisions and flags
up to three that cost the most win probability. The bots never see hidden cards — they reason
from bidding, discards, and play, exactly as you can.
</div>
<div class="panel-actions"><button class="cta" id="btnCloseRules">Back</button></div>`;
openPanel(panel, '#btnCloseRules');
panel.querySelector('#btnCloseRules').addEventListener('click', showSettings);
}
function injectManifest() {
if (!/^https?:$/.test(location.protocol)) return;
try {
const icon = size => {
const cv = document.createElement('canvas');
cv.width = cv.height = size;
const g = cv.getContext('2d');
g.fillStyle = '#0c1210'; g.fillRect(0, 0, size, size);
g.strokeStyle = '#c9a557'; g.lineWidth = Math.max(2, size * 0.02);
g.strokeRect(size * 0.09, size * 0.09, size * 0.82, size * 0.82);
g.fillStyle = '#c9a557';
g.font = `700 ${Math.round(size * 0.34)}px Palatino, Georgia, serif`;
g.textAlign = 'center'; g.textBaseline = 'middle';
g.fillText('500', size / 2, size / 2 + size * 0.02);
return cv.toDataURL('image/png');
};
const here = location.href.replace(/[#?].*$/, '');
const manifest = {
name: '500 Elite', short_name: '500',
start_url: here, scope: here.replace(/[^/]*$/, ''),
display: 'standalone',
background_color: '#0c1210', theme_color: '#0c1210',
icons: [
{ src: icon(192), sizes: '192x192', type: 'image/png' },
{ src: icon(512), sizes: '512x512', type: 'image/png' }
]
};
const link = document.createElement('link');
link.rel = 'manifest';
link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
document.head.appendChild(link);
} catch (e) {   }
}
function saveLiveMatch() {
if (practice()) return;
if (!G.match || G.match.finished) { Persist.set('liveMatch', null); return; }
Persist.set('liveMatch', {
seed: G.match.seed, handNo: G.match.handNo, dealer: G.match.dealer,
scores: G.match.scores.slice(), matchIndex: G.matchIndex,
decisionCounter: G.match.decisionCounter, when: Date.now()
});
}
function validLiveMatch() {
const lm = Persist.get('liveMatch', null);
if (!lm || typeof lm !== 'object' || Array.isArray(lm)) return null;
if (!Number.isInteger(lm.seed) || !Number.isInteger(lm.handNo) || lm.handNo < 0 || lm.handNo > 500) return null;
if (!Number.isInteger(lm.dealer) || lm.dealer < 0 || lm.dealer > 3) return null;
if (!Array.isArray(lm.scores) || lm.scores.length !== 2 ||
!lm.scores.every(s => Number.isInteger(s) && s > -5000 && s < 5000)) return null;
return lm;
}
async function resumeMatch(lm) {

G.match.dealer = lm.dealer;
G.match.scores = lm.scores.slice();
if (Number.isInteger(lm.decisionCounter)) G.match.decisionCounter = lm.decisionCounter;
G.hand = null;
